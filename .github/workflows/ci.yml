# Hasta este archivo, el único portón automático del repo era el build de
# Vercel — y main despliega a producción. Todo lo que entraba salía sin que
# nadie hubiera corrido typecheck, lint ni un test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nada de esta corrida necesita escribir en el repo.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la corrida anterior en vez de
# encolarla: la única respuesta que importa es la del último commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Un job colgado no es un fallo: se queda "en curso" y nadie lo mira. El
    # corte lo vuelve un rojo explícito. Medido: la corrida completa tarda
    # bastante menos, el margen es para un runner lento.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Si las dependencias no se instalan no hay nada que verificar, así que
      # este paso sí es un cortocircuito y los de abajo lo consultan.
      - name: install
        id: install
        run: npm ci

      # Los pasos de verificación son INDEPENDIENTES entre sí a propósito: que
      # falle el lint no debe esconder que además falla un test. Una sola
      # corrida tiene que mostrar todos los fallos, no el primero.
      #
      # Se usa `!cancelled()` y no `always()` porque `always()` también corre
      # sobre un job ya cancelado, y eso pelea con el cancel-in-progress de
      # arriba: gastaría minutos verificando un commit que ya nadie espera.
      # `!cancelled()` cumple lo mismo —ningún fallo tapa a otro— sin ese costo.
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Los guards de gasto se verifican solos en cada PR. Antes esto dependía
      # de que alguien se acordara de correrlo a mano, que es la definición de
      # una verificación que no existe.
      - name: guards selfcheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .codex/hooks/selfcheck.sh

      # Verificado sobre un worktree limpio de main: el build NO necesita
      # variables de entorno. Si algún día las necesita, va a fallar acá y no
      # en el deploy a producción.
      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  # El esquema es la otra mitad del repo y hasta ahora nada lo verificaba: los
  # tests de arriba corren contra dobles, así que probaban la LÓGICA y nunca
  # que una policy aislara a un tenant de otro.
  #
  # Este job levanta el esquema real desde supabase/migrations, con el mismo
  # stub de auth que usa supabase/qa/replica.sh en local — un solo archivo, no
  # dos copias que puedan discrepar — y corre las aserciones como un rol
  # NOSUPERUSER NOBYPASSRLS. Como superusuario saltearía RLS y no probaría nada.
  schema:
    name: schema isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # La imagen de Supabase, no una PostgreSQL pelada. Trae `supabase_vault`
        # —que hosted tiene y `postgres:17` no—, y con él los roles reales:
        # `postgres` deja de ser superusuario, como en hosted, y `service_role`
        # trae su BYPASSRLS de fábrica.
        #
        # Sin POSTGRES_DB a propósito: esta imagen crearía esa base con
        # `supabase_admin` de dueño y entonces `postgres` no podría ni crear un
        # esquema adentro. La crea el primer paso del job, y así la posee.
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: growthos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: growthos
      PSQL: psql -h localhost -U postgres -d growthos -v ON_ERROR_STOP=1

    steps:
      - uses: actions/checkout@v4

      # La base y el Vault, lo mismo que hace supabase/qa/replica.sh en local.
      # Van juntos y antes que todo lo demás: el resto del job se conecta con
      # `-d growthos`, que hasta acá no existe.
      - name: base growthos, y el Vault
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE growthos"
          $PSQL -c "CREATE EXTENSION IF NOT EXISTS supabase_vault CASCADE"

      - name: auth stub
        id: stub
        run: $PSQL -f supabase/qa/auth_stub.sql

      # En orden y abortando en el primer error: una migración que falla y deja
      # correr a la siguiente produce un esquema que no existe en ninguna parte.
      - name: migrations
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            $PSQL -f "$f"
          done

      - name: application role
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        run: $PSQL -f supabase/qa/app_role.sql

      - name: tenant isolation assertions
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        run: $PSQL -f supabase/qa/defects_test.sql
